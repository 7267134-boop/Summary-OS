    <!-- ========================================================================= -->
    <!-- QUESTIONS MODAL (3-Pill Tabs: Open, MCQ, Guide)                          -->
    <!-- ========================================================================= -->
    <div id="questions-modal"
        onclick="if(event.target === this) closeQuestionsModal()"
        class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center opacity-0 pointer-events-none transition-all duration-300">
        <div onclick="event.stopPropagation()"
            class="bg-white border border-slate-200/90 w-[85vw] h-[85vh] max-w-[1400px] mx-auto rounded-3xl shadow-2xl flex flex-col transform scale-95 transition-all duration-300 overflow-hidden text-right" dir="rtl">
            <!-- Modal Header -->
            <div class="px-6 py-4 border-b border-slate-200 bg-white flex items-center justify-between shadow-sm shrink-0">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-2xl bg-blue-50 border border-blue-100 flex items-center justify-center text-blue-600 font-black text-lg shadow-sm">❓</div>
                    <div>
                        <h3 id="modal-title" class="text-base md:text-lg font-black text-slate-900 tracking-tight flex items-center gap-2">
                            <span id="modal-section-name">שאלות מנחות ותרגול</span>
                        </h3>
                        <p class="text-xs text-slate-500 font-medium">מאגר שאלות עיוניות, רב-ברירה ושאלות מדריך להעמקה והכנה למבחן</p>
                    </div>
                </div>
                <button onclick="closeQuestionsModal()"
                    class="w-9 h-9 rounded-full flex items-center justify-center text-slate-400 hover:text-slate-700 hover:bg-slate-100 transition-colors cursor-pointer text-2xl font-bold" title="סגור חלון">&times;</button>
            </div>

            <!-- Modal Sub-Tabs Switcher (3-Pill Design) -->
            <div class="px-6 pt-3 pb-3 bg-slate-50/80 border-b border-slate-200 flex justify-center shrink-0">
                <div class="flex p-1 bg-slate-200/80 rounded-2xl w-full max-w-xl shadow-inner gap-1">
                    <button id="modal-tab-btn-open" onclick="switchModalTab('open')"
                        class="flex-1 py-2 px-3 rounded-xl text-xs md:text-sm font-black transition-all bg-white text-blue-600 shadow-sm border border-slate-200/60 flex items-center justify-center gap-1.5 cursor-pointer">
                        <span>📝</span>
                        <span>שאלות פתוחות להעמקה</span>
                    </button>
                    <button id="modal-tab-btn-mcq" onclick="switchModalTab('mcq')"
                        class="flex-1 py-2 px-3 rounded-xl text-xs md:text-sm font-bold text-slate-600 hover:text-slate-900 transition-all flex items-center justify-center gap-1.5 cursor-pointer">
                        <span>🎯</span>
                        <span>שאלות אמריקאיות</span>
                    </button>
                    <button id="modal-tab-btn-guide" onclick="switchModalTab('guide')"
                        class="flex-1 py-2 px-3 rounded-xl text-xs md:text-sm font-bold text-slate-600 hover:text-slate-900 transition-all flex items-center justify-center gap-1.5 cursor-pointer">
                        <span>📖</span>
                        <span>שאלות מהמדריך</span>
                    </button>
                </div>
            </div>

            <!-- Modal Body Content -->
            <div class="flex-1 overflow-y-auto p-6 space-y-6 dark-scroll bg-slate-50/50">
                <div id="modal-open-section" class="space-y-4 max-w-5xl mx-auto"></div>
                <div id="modal-mcq-section" class="space-y-6 max-w-5xl mx-auto hidden"></div>
                <div id="modal-guide-section" class="space-y-4 max-w-5xl mx-auto hidden"></div>
            </div>
        </div>
    </div>
