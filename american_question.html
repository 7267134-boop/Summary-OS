                generalExplanation: "התשובה הנכונה היא ו' - נדרשות 6 רמות היררכיה.\n\nהסבר החישוב לעומק:\nכדי לפתור שאלות מהסוג הזה, עלינו לפרק את הכתובת הלוגית (הווירטואלית) לחלקים שלה: מספר הדף הלוגי (Page Number) וההיסט בתוך הדף (Offset).\n\n\n\nשלב 1: חישוב מספר הביטים עבור ההיסט (Offset)\nנתון שגודל דף הוא 4KB. נמיר את זה לחזקות של 2:\n4KB = 4 × 1024 Bytes = 2² × 2¹⁰ = 2¹² Bytes\nמכיוון שהזיכרון ממוען ברמת הבית (byte-addressable), אנחנו צריכים 12 ביטים כדי לייצג כל כתובת (היסט) בתוך דף בודד.\n\nשלב 2: חישוב מספר הביטים עבור מספר הדף הלוגי\nנתון שמרחב הכתובות הווירטואלי כולו הוא 64 ביטים.\nנחסיר מהכתובת הכוללת את הביטים של ההיסט שמצאנו:\n64 - 12 = 52 bits\nכלומר, נשארו לנו 52 ביטים שמייצגים את מספר הדף. את 52 הביטים האלו אנחנו צריכים למפות באמצעות טבלת הדפים הרב-רמתית.\n\nשלב 3: כמה כניסות (PTE) נכנסות בדף אחד?\nהאילוץ הקריטי בשאלה הוא המשפט: \"אין כל אפשרות להבטיח הקצאה רצופה של יותר מדף אחד...\". משמעות המשפט היא שכל חלק (Node) בטבלת הדפים בכל רמה חייב להיכנס בדיוק לתוך דף פיזי אחד (4KB).\nנתון שכל כניסה (PTE) בטבלה תופסת 4 בתים (2² בתים).\nנחשב כמה כניסות אפשר לדחוס לתוך דף אחד:\n(Page Size) / (PTE Size) = 2¹² / 2² = 2¹⁰ Entries\nמכיוון שבכל דף-טבלה נכנסות בדיוק 2¹⁰ כניסות, כל רמה בהיררכיה יכולה \"לפענח\" בדיוק 10 ביטים מתוך הכתובת הלוגית.\n\nשלב 4: חלוקת הביטים לרמות\nיש לנו 52 ביטים למפות, וכל רמה בטבלה מסוגלת למפות 10 ביטים. נחלק את מספר הביטים הכולל בקיבולת של כל רמה, ונעגל כלפי מעלה (כי גם שארית של ביטים דורשת רמה נוספת):\n⌈ 52 / 10 ⌉ = ⌈ 5.2 ⌉ = 6 Levels\n\nמבנה 52 הביטים יחולק כך:\n• רמה 1 (הפנימית ביותר): 10 ביטים\n• רמה 2: 10 ביטים\n• רמה 3: 10 ביטים\n• רמה 4: 10 ביטים\n• רמה 5: 10 ביטים\n• רמה 6 (החיצונית ביותר, Root): 2 הביטים הנותרים (טבלה זו לא תהיה מלאה, היא תתפוס רק דף אחד, ותכיל 2²=4 כניסות).\nסה\"כ: 6 רמות.",

                generalExplanation: "התשובה הנכונה היא ד' - לכל היותר P ולכל הפחות N.\n\nהסבר לעומק:\nכדי למצוא את החסמים (מינימום ומקסימום), עלינו לחשוב על התרחיש הטוב ביותר (האופטימלי) והתרחיש הגרוע ביותר, בהתאמה.\n\n\n\nנפרק את המשתנים:\n• P = סך כל הגישות לזיכרון שהתהליך מבצע (הפעולות בפועל).\n• N = מספר הדפים השונים (הייחודיים) שהתהליך צריך במהלך הריצה שלו.\n\nהחסם התחתון (המינימום האפשרי - \"ולכל הפחות N\"):\nכאשר התהליך מתחיל לרוץ, הזיכרון המוקצה לו (המסגרות / Frames) ריק לחלוטין. בכל פעם שהוא ניגש לדף חדש שהוא טרם ניגש אליו, בהכרח תתרחש פסיקת דף (זה נקרא Compulsory Miss או Cold-start Fault). מכיוון שידוע שהתהליך ניגש ל-N דפים שונים במהלך חייו, מערכת ההפעלה חייבת להביא כל אחד מ-N הדפים האלו מהדיסק אל הזיכרון לפחות פעם אחת. לכן, גם אם נשתמש באלגוריתם החלפה מושלם שיודע את העתיד, לא נוכל בשום אופן לרדת מתחת ל-N פסיקות דף.\n\nהחסם העליון (המקסימום האפשרי - \"לכל היותר P\"):\nבסך הכל, התהליך מבצע P ניסיונות גישה לזיכרון. כל ניסיון גישה יכול להסתיים, במקרה הגרוע, בפסיקת דף. תדמיין אלגוריתם החלפה נוראי (או דפוס ריצה בעייתי) שבו רגע לפני שהתהליך צריך דף מסוים, המערכת בדיוק מפנה אותו לדיסק. במצב תיאורטי וקיצוני זה (שמוביל לתופעת Thrashing), כל אחת ואחת מ-P הגישות תגרור פסיקת דף. מעבר ל-P פסיקות דף אי אפשר להגיע, כי פשוט אין יותר מ-P פעולות גישה. לכן המקסימום הוא P.",

                generalExplanation: "התשובה הנכונה היא א' - פתיחת קובץ באמצעות open.\n\nהסבר לעומק: כאשר מבצעים קריאת מערכת open כדי לפתוח קובץ, מעבירים לה את הנתיב שלו (Path), למשל /home/user/docs/file.txt. מכיוון שזיכרון המטמון ריק לחלוטין (Cold Cache), למערכת ההפעלה אין מושג היכן הקובץ נמצא בדיסק. עליה לבצע תהליך שנקרא \"פענוח נתיב\" (Path Resolution).\n\n\n\nהתהליך הזה ארוך ומייגע עבור הדיסק. המערכת צריכה:\n1. לגשת לדיסק ולקרוא את ה-I-node של ספריית השורש (/).\n2. לגשת לדיסק שוב ולקרוא את בלוק הנתונים של השורש כדי לחפש בו את התיקייה home.\n3. לגשת לדיסק ולקרוא את ה-I-node של home.\n4. לגשת לדיסק ולקרוא את בלוק הנתונים של home כדי לחפש את user.\nוחוזר חלילה... עבור כל רכיב בנתיב.\n\nבסופו של דבר, פתיחת קובץ דורשת קריאה של לפחות שני בלוקים (I-node ובלוק נתונים) עבור כל ספרייה בנתיב. זוהי שרשרת ארוכה של פסיקות דיסק (disk transfers), ולכן באופן מובהק זוהי הפעולה היקרה ביותר מבין האפשרויות.",

            {

                text: "מהי הסיבה העיקרית לשימוש ב-DMA?",
                generalExplanation: "התשובה הנכונה היא ב' - שיפור ביצועי המערכת ע\"י הגדלת המקביליות.\n\nהסבר לעומק: ראשי התיבות DMA עומדים על Direct Memory Access (גישה ישירה לזיכרון). במערכות ללא DMA, כאשר תהליך רוצה לקרוא או לכתוב כמות גדולה של נתונים להתקן חיצוני (כמו דיסק קשיח או כרטיס רשת), המעבד המרכזי (CPU) חייב לנהל את ההעברה בעצמו. הוא קורא בית אחר בית מההתקן וכותב אותו לזיכרון (או להפך). בזמן הזה, המעבד \"מרותק\" למשימת הקלט/פלט ולא יכול לבצע שום חישוב אחר.\n\n\n\nבקר ה-DMA פותר את הבעיה הזו. הוא למעשה \"מעבד קטן\" ייעודי שכל תפקידו הוא להעביר נתונים. המעבד הראשי נותן לבקר ה-DMA פקודה (למשל: \"קרא בלוק נתונים מהדיסק והעתק אותו לכתובת X בזיכרון הראשי\"), ומאותו רגע המעבד הראשי משתחרר לחלוטין. בזמן שבקר ה-DMA מבצע את העברת הנתונים ה\"שחורה\" מאחורי הקלעים, המעבד הראשי פנוי להריץ תהליכים אחרים (Context Switch). ברגע שה-DMA מסיים את ההעברה, הוא שולח פסיקה (Interrupt) למעבד כדי לעדכן אותו.\n\nהיכולת הזו של המעבד להריץ קוד במקביל להעברת הנתונים היא המקביליות (Concurrency) שעליה מדובר בסעיף, והיא משפרת דרמטית את התפוקה הכוללת של המערכת.",

                    { id: 'c', text: "ג. הקטנת העומס על הזיכרון הראשי.", isCorrect: false, explanation: "שגוי. ה-DMA ממש לא מקטין את העומס על הזיכרון הראשי (RAM); למעשה, במובן מסוים הוא אפילו מתחרה איתו. בסופו של דבר, הנתונים חייבים להיכתב אל הזיכרון הראשי או להיקרא ממנו. הזיכרון \"עובד\" בדיוק באותה מידה כדי לקלוט את המידע, רק שמי שמזרים לו את המידע עכשיו הוא בקר ה-DMA ולא המעבד. לעיתים בקר ה-DMA צריך \"לגנוב מחזורי שעון\" (Cycle Stealing) של גישה לערוץ הזיכרון (Memory Bus) מהמעבד, כך שהעומס על ערוץ הזיכרון נשאר ולעתים מנוהל בנוקשות יותר." },

            {
                id: 15,
                text: "מהו החיסרון המובהק של שיטת ה- rendezvous לעומת ה- mailbox ב- message passing?",

                options: [

                generalExplanation: "התשובה הנכונה היא ב' - כמספר המסגרות (frames) בזיכרון הפיזי.\n\nהסבר לעומק: כדי להבין את התשובה, נזכיר את הבעיה שטבלת דפים הפוכה באה לפתור. בשיטת הדפדוף הרגילה, מערכת ההפעלה מנהלת טבלה לכל תהליך, והטבלה צריכה להכיל שורה עבור כל דף וירטואלי אפשרי. במערכות מודרניות של 64-ביט, מרחב הזיכרון הווירטואלי הוא עצום, וטבלאות הדפים הרגילות הפכו למפלצות שגוזלות חלק משמעותי מהזיכרון הפיזי בעצמן.\n\nהפתרון של \"טבלת דפים הפוכה\" (Inverted Page Table) הופך את היוצרות: במקום טבלה פרטית לכל תהליך שממפה מ\"וירטואלי לפיזי\", המערכת מחזיקה טבלה גלובלית אחת בלבד לכל המערכת. הטבלה הזו בנויה כך שיש בה בדיוק שורה אחת (כניסה) עבור כל \"בלוק\" פיזי אמיתי שקיים ב-RAM. הבלוקים הללו נקראים מסגרות (Frames).\nכך, גודל הטבלה קבוע לחלוטין ותלוי אך ורק בכמות הזיכרון הפיזי המותקן במחשב. בשורה עצמה רשום איזה תהליך (PID) ואיזה דף וירטואלי מאכלסים כרגע את המסגרת הזו. מכיוון שהטבלה מסודרת לפי הזיכרון הפיזי ולא לפי הווירטואלי, כמות הכניסות בה חייבת להיות בדיוק כמספר המסגרות בזיכרון הפיזי.",
                options: [
                    { id: 'a', text: "א. כמספר הדפים בזיכרון המדומה.", isCorrect: false, explanation: "שגוי. מספר הדפים בזיכרון המדומה מגדיר את כמות הכניסות בטבלת דפים רגילה של תהליך. כל המטרה של טבלת דפים הפוכה היא לברוח מהתלות הזו בגודל הזיכרון המדומה (שהוא עצום ומוגבל רק על ידי ארכיטקטורת המעבד), ולעבור לתלות בגודל הזיכרון הפיזי (שהוא מוגבל הרבה יותר וקטן משמעותית)." },
                    { id: 'b', text: "ב. כמספר המסגרות (frames) בזיכרון הפיזי.", isCorrect: true, explanation: "נכון מאוד! טבלת דפים הפוכה נשענת על הזיכרון הפיזי, ויש בה כניסה אחת לכל מסגרת (Frame) ב-RAM, ללא קשר לגודל מרחב הכתובות הווירטואלי. ראו הסבר מורחב מטה." },
                    { id: 'c', text: "ג. כמספר הדפים המקסימאלי שיכול לדרוש תהליך.", isCorrect: false, explanation: "שגוי. גם זה מתאר מאפיין של טבלת דפים רגילה. בשיטה הרגילה, גודל הטבלה של התהליך נגזר ישירות ממרחב הכתובות הווירטואלי המקסימלי שהוקצה לו. בטבלה הפוכה, הצרכים הווירטואליים של התהליך לא מעניינים את המבנה של הטבלה – הטבלה תמיד תישאר באותו גודל, לפי ה-RAM." },
                    { id: 'd', text: "ד. כמספר הגדול ביותר שניתן לרשום בשדה הכתובת הוירטואלית.", isCorrect: false, explanation: "שגוי. שדה הכתובת הווירטואלית קובע את גודל מרחב הזיכרון הווירטואלי (כלומר סעיפים א' ו-ד' למעשה מתארים את אותו הרעיון במילים אחרות). אם היינו בונים טבלה הפוכה לפי המספר הזה, חזרנו בדיוק לאותה הבעיה שבה הטבלה גדולה מדי." }
                ]
            },
            {
                id: 20,
                text: "לפניכם פסאודו-קוד של משחק רובוטים שבו 3 רובוטים בצבעים (אדום, כחול, ירוק) מבצעים תזוזות בסדר כלשהו:<br><pre class=\"text-left bg-gray-100 p-2 rounded my-2 font-mono text-sm\" dir=\"ltr\"><code>int sem[3];\nsem[0] = 1; sem[1] = 1; sem[2] = 1;\n\nR_Robot() {\n    while(true) {\n        down(sem[0]);\n        &lt;Make Move&gt;\n        up(sem[1]);\n    }\n}\n\nG_Robot() {\n    while(true) {\n        down(sem[1]);\n        &lt;Make Move&gt;\n        up(sem[2]);\n    }\n}\n\nB_Robot() {\n    while(true) {\n        down(sem[2]);\n        &lt;Make Move&gt;\n        up(sem[0]);\n    }\n}\n\nint main() {\n    run_new_thread(R_Robot);\n    run_new_thread(G_Robot);\n    run_new_thread(B_Robot);\n}</code></pre>האם סדר התזוזות של הרובוטים נקבע על ידי השימוש בסמפורים כדלהלן?<br>אם כן, מהו הסדר?",
                generalExplanation: "התשובה הנכונה היא ד' - לא. הסדר ייקבע על ידי מתזמן (scheduler).\n\nהסבר לעומק:\nהסוד של השאלה הזו מסתתר בשורת האתחול הראשונה: sem[0] = 1; sem[1] = 1; sem[2] = 1;.\nכאשר פונקציית ה-main יוצרת את שלושת התהליכונים (Threads), כל אחד מהם רץ ומיד מגיע לפקודת ה-down() על הסמפור שלו.\nמכיוון שכל שלושת הסמפורים מאותחלים ל-1, פקודת ה-down() תצליח באופן מיידי עבור כל אחד מהרובוטים! אף אחד מהם לא ייחסם בהתחלה.\n\nמי יזוז ראשון? זה תלוי אך ורק במתזמן התהליכים (Scheduler) של מערכת ההפעלה. המתזמן יכול להחליט להריץ קודם את האדום, או את הירוק, או את הכחול. אם מדובר במעבד מרובה-ליבות, ייתכן אפילו ששלושתם יתחילו לבצע את ה-&lt;Make Move&gt; באותה אלפית שנייה בדיוק (במקביל).\n\nיתרה מכך, האתחול השגוי הזה גורם להתנהגות כאוטית. נניח שהאדום ירוץ מהר מאוד. הוא יוריד את sem[0] ל-0, ואז יעלה את sem[1] ל-2! ואז יעלה אותו ל-3, וכן הלאה. הסמפורים כאן מאבדים את משמעותם כסדרנים, והמערכת לא אוכפת שום סדר מחזורי מוגדר. לכן הסדר לא נקבע על ידי הסמפורים, אלא נתון לחסדי התזמון.",
                options: [
                    { id: 'a', text: "א. כן. אדום, ירוק, כחול וחוזר חלילה", isCorrect: false, explanation: "שגוי. סעיפים א', ב' ו-ג' מתחילים במילה \"כן\", ומניחים שהקוד מצליח לאכוף סדר ברור. הם שגויים מכיוון שכפי שהוכחנו, הקוד לא אוכף שום סדר. כדי לאכוף סדר כזה היה צריך לאתחל: sem[0] = 1; sem[1] = 0; sem[2] = 0;." },
                    { id: 'b', text: "ב. כן. אדום, כחול, ירוק וחוזר חלילה", isCorrect: false, explanation: "שגוי. הקוד לא אוכף שום סדר כיוון שכל הסמפורים מאותחלים ל-1, מה שמאפשר לכל רובוט להיכנס לקטע הקריטי באופן מיידי, לפי החלטת המתזמן." },
                    { id: 'c', text: "ג. כן. אדום, כחול, אדום, כחול, ירוק וחוזר חלילה", isCorrect: false, explanation: "שגוי. שוב, ההנחה שהקוד אוכף סדר מסוים אינה נכונה בגלל שורת האתחול השגויה שמאפשרת לכולם לרוץ." },
                    { id: 'd', text: "ד. לא. הסדר ייקבע על ידי מתזמן (scheduler)", isCorrect: true, explanation: "נכון מאוד! מכיוון שכל הסמפורים מאותחלים ל-1, פקודות ה-down הראשונות של כולם יצליחו. אין כאן סנכרון אמיתי שמאלץ סדר, והכל תלוי בהחלטות המתזמן. ראו הסבר מורחב מטה." }

            {
                id: 21,
                text: "איזו תכונה נדרשת למעבד CPU בשביל שיהיה ניתן לממש עליו וירטואליזציה יעילה בשיטת Trap-and simulate?",
                generalExplanation: "התשובה הנכונה היא ד' - אף תשובה איננה נכונה.\n\nהסבר לעומק: כדי להבין למה אף תשובה אינה נכונה (ובעיקר למה סעיף ב' הוא מלכודת), נזכיר איך עובדת שיטת ה-Trap-and-Emulate (או Simulate) ומה התנאי להצלחתה:\nבשיטה זו, מערכת ההפעלה האורחת (Guest OS) רצה למעשה במצב משתמש (User Mode), בעוד שמנהל המכונות הווירטואליות (Hypervisor/VMM) רץ ב-Kernel Mode.\nישנם שני סוגי פקודות שחשוב להבדיל ביניהם:\n\n1. פקודות רגישות (Sensitive Instructions): פקודות שמנסות לשנות את משאבי החומרה (כמו לשנות את טבלת הדפים או לכבות פסיקות), או פקודות שההתנהגות שלהן משתנה תלוי באיזה מוד אנחנו נמצאים.\n2. פקודות מיוחסות (Privileged Instructions): פקודות שהחומרה *אוכפת* את ההגנה עליהן – ניסיון להריץ אותן במצב משתמש יגרום מיידית לכישלון ולזריקת פסיקה (Trap) ל-Kernel.\n\nהשיטה עובדת כך: ה-Guest מנסה להריץ פקודה רגישה. מכיוון שהוא ב-User Mode, הפקודה נכשלת וזורקת Trap ל-Hypervisor. ה-Hypervisor מזהה מה ה-Guest ניסה לעשות, מסמלץ (Simulates) את הפעולה הזו עבורו, ומחזיר לו את השליטה.\nהתנאי ההכרחי של פופק וגולדברג כדי שזה יעבוד הוא שכל הפקודות הרגישות חייבות להיות פקודות מיוחסות (מתמטית: קבוצת הפקודות הרגישות היא תת-קבוצה של המיוחסות).\nאם קיימת במעבד פקודה רגישה שהיא *אינה* מיוחסת, ה-Guest יריץ אותה, היא תתבצע בשקט בלי לזרוק Trap, ה-Hypervisor בכלל לא יידע שזה קרה, והמכונה הווירטואלית תשתבש לחלוטין (זו בדיוק הייתה הבעיה במעבדי x86 הישנים שדרשה פתרונות מורכבים בעבר).\n\nמכיוון שהתנאי הזה לא מופיע באף אחת מהתשובות (וסעיף ב' אומר בדיוק את ההפך), התשובה היא ד'.",
                options: [
                    { id: 'a', text: "א. מעבר המעבד ל kernel mode נעשה רק בעקבות פסיקה.", isCorrect: false, explanation: "שגוי. ראשית, זו אינה התכונה הרשמית שמגדירה תמיכה בוירטואליזציה. שנית, עובדתית, מעבר ל-Kernel Mode יכול להתרחש לא רק בעקבות פסיקת חומרה, אלא גם בעקבות קריאת מערכת יזומה (System Call) או שגיאה/חריגה (Exception)." },
                    { id: 'b', text: "ב. כל הפקודות המיוחסות (privileged instructions, הגורמות ל TRAP) מהוות תת-קבוצה של הפקודות הרגישות (sensitive instructions) במערכת.", isCorrect: false, explanation: "שגוי. זוהי מלכודת קלאסית. המשפט הזה הפוך מתמטית לדרישה האמיתית. הדרישה היא שהרגישות יהיו תת-קבוצה של המיוחסות, ולא להפך. אם קיימת פקודה רגישה שאינה מיוחסת, היא לא תזרוק Trap והוירטואליזציה תיכשל." },
                    { id: 'c', text: "ג. פסיקות חומרה מגיעות למעבד רק מתי שהוא כבר נמצא ב kernel mode.", isCorrect: false, explanation: "שגוי. טענה זו חסרת היגיון. פסיקות נועדו בדיוק כדי לעצור את המעבד כשהוא רץ במצב משתמש (User Mode), ולהכריח אותו לעבור ל-Kernel Mode כדי לטפל באירוע (כמו במקרה של פסיקת שעון למניעת לולאות אינסופיות)." },
                    { id: 'd', text: "ד. אף תשובה איננה נכונה.", isCorrect: true, explanation: "נכון מאוד! התנאי ההכרחי של פופק וגולדברג (שכל הפקודות הרגישות יהיו מיוחסות) לא מופיע כאן, וסעיף ב' מציג בדיוק את הטענה ההפוכה, ולכן אף תשובה לא נכונה." }
                ]

            {
                id: 22,
                text: "אזור של זיכרון משותף SHARED MEMORY בין שני תהליכים נוצר ע\"י מערכת ההפעלה כשבכל אחת מטבלאות דפים יש מצביעים לאזור המשותף של שני התהליכים במצב זה:",
                generalExplanation: "התשובה הנכונה היא ד' - האזור המשותף אינו חייב להיות ממופה לאותה כתובת וירטואלית במרחבי הכתובות של שני התהליכים.\n\nהסבר לעומק: כדי להבין למה התשובה הזו נכונה, נזכיר איך עובד זיכרון וירטואלי. לכל תהליך יש \"אשליה\" של מרחב כתובות עצמאי ורציף (למשל מכתובת 0 עד 4GB). טבלת הדפים (Page Table) של התהליך מתרגמת את הכתובת הווירטואלית (האשליה) לכתובת פיזית (הזיכרון האמיתי ב-RAM).\n\nכאשר מערכת ההפעלה מייצרת זיכרון משותף (Shared Memory), היא למעשה לוקחת מסגרת פיזית אחת ב-RAM (למשל מסגרת מספר 100), ואומרת לשני התהליכים (או יותר) להצביע עליה מהטבלאות שלהם.\nהיופי והעוצמה של הזיכרון הווירטואלי הוא שכל תהליך יכול להצביע למסגרת הזו מאיזה דף וירטואלי שהוא רוצה.\n\n* בתהליך א', יכול להיות שדף וירטואלי מספר 5 יצביע למסגרת 100. מבחינת תהליך א', הזיכרון המשותף יושב בכתובת וירטואלית 0x5000.\n* בתהליך ב', יכול להיות שדף וירטואלי מספר 20 יצביע לאותה מסגרת 100. מבחינת תהליך ב', הזיכרון המשותף בכלל יושב בכתובת וירטואלית 0x14000.\n\nהמערכת לא מכריחה את הכתובות הווירטואליות להיות זהות; כל מה שחשוב הוא שבסוף תהליך התרגום, שתיהן ינחתו על אותה מסגרת פיזית (Frame 100). לכן, האזור המשותף אינו חייב להיות ממופה לאותה כתובת וירטואלית.",
                options: [
                    { id: 'a', text: "א. האזור המשותף חייב להיות ממופה לאותה כתובת וירטואלית במרחבי הכתובות של שני התהליכים.", isCorrect: false, explanation: "שגוי. אין שום הכרח או חובה כזו. אמנם מערכת ההפעלה יכולה לנסות לשים את הזיכרון המשותף באותה כתובת וירטואלית (לפעמים זה נוח יותר), אבל זה לא תמיד אפשרי כי מרחב הכתובות של אחד התהליכים עשוי להיות כבר תפוס באותו אזור. המערכת תמפה את הזיכרון לכל כתובת וירטואלית שפנויה אצל כל תהליך בנפרד." },

        function renderQuestions() {
            const container = document.getElementById('quiz-container');
            container.innerHTML = '';

            questionsData.forEach((q, index) => {
                const questionCard = document.createElement('div');
                questionCard.className = 'bg-white rounded-2xl shadow-lg p-6 border-t-4 border-blue-500';

                const questionTitle = document.createElement('h2');
                questionTitle.className = 'text-xl font-semibold text-gray-800 mb-6 whitespace-pre-line';
                questionTitle.innerText = q.text;
                questionCard.appendChild(questionTitle);

                const optionsList = document.createElement('div');
                optionsList.className = 'space-y-4 mb-6';

                const generalExpDiv = document.createElement('div');
                generalExpDiv.className = 'expandable-content bg-blue-50 text-blue-900 p-0 rounded-lg mt-6 text-base font-medium';
                generalExpDiv.innerHTML = `<div class="p-4 border-r-4 border-blue-500"><strong>הסבר כללי לעומק: </strong><br><br>${q.generalExplanation.replace(/\n/g, '<br>')}</div>`;

                q.options.forEach(opt => {
                    const optionContainer = document.createElement('div');
                    optionContainer.className = 'flex flex-col';

                    const optionBtn = document.createElement('button');
                    optionBtn.className = 'option-button w-full text-right p-4 rounded-xl border-2 border-gray-200 bg-gray-50 hover:bg-gray-100 font-semibold text-gray-700 focus:outline-none';
                    optionBtn.innerText = opt.text;

                    const specificExpDiv = document.createElement('div');
                    specificExpDiv.className = 'expandable-content mt-2 text-sm font-medium rounded-lg p-0';

                    if (opt.isCorrect) {
                        specificExpDiv.classList.add('bg-green-100', 'text-green-800');
                        specificExpDiv.innerHTML = `<div class="p-3 border-r-4 border-green-500">${opt.explanation}</div>`;
                    } else {
                        specificExpDiv.classList.add('bg-red-100', 'text-red-800');
                        specificExpDiv.innerHTML = `<div class="p-3 border-r-4 border-red-500">${opt.explanation}</div>`;
                    }

                    optionBtn.onclick = () => {
                        // Reveal specific explanation
                        specificExpDiv.classList.add('expanded');

                        // Style button based on correct/incorrect
                        if (opt.isCorrect) {
                            optionBtn.classList.replace('border-gray-200', 'border-green-500');
                            optionBtn.classList.replace('bg-gray-50', 'bg-green-50');
                        } else {
                            optionBtn.classList.replace('border-gray-200', 'border-red-500');
                            optionBtn.classList.replace('bg-gray-50', 'bg-red-50');
                        }

                        // Reveal general explanation
                        generalExpDiv.classList.add('expanded');
                    };

                    optionContainer.appendChild(optionBtn);
                    optionContainer.appendChild(specificExpDiv);
                    optionsList.appendChild(optionContainer);
                });

                questionCard.appendChild(optionsList);
                questionCard.appendChild(generalExpDiv);
                container.appendChild(questionCard);
            });
        }

        // Initialize quiz rendering
        renderQuestions();
    </script>
